<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SQL Trainer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1e1e2e;
      --panel: #252538;
      --panel-2: #2f3046;
      --border: #45475a;
      --text: #cdd6f4;
      --muted: #a6adc8;
      --accent: #89b4fa;
      --success: #a6e3a1;
      --error: #f38ba8;
      --warning: #f9e2af;
      --code: #181825;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    button {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel-2);
      color: var(--text);
      padding: 10px 14px;
      font: inherit;
      cursor: pointer;
      transition: border-color 120ms ease, color 120ms ease, background 120ms ease;
    }

    button:hover:not(:disabled) {
      border-color: var(--accent);
      color: white;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(260px, 30%) minmax(0, 70%);
      min-height: 100vh;
    }

    .sidebar {
      overflow-y: auto;
      border-right: 1px solid var(--border);
      background: #181825;
      padding: 22px 18px;
    }

    .brand {
      margin: 0 0 18px;
      color: white;
      font-size: 24px;
      line-height: 1.1;
    }

    .topic-title {
      margin: 22px 0 8px;
      color: var(--accent);
      font-size: 13px;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .task-list {
      display: grid;
      gap: 8px;
    }

    .task-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      width: 100%;
      background: transparent;
      padding: 11px 12px;
      text-align: left;
    }

    .task-item.active {
      border-color: var(--accent);
      background: rgba(137, 180, 250, 0.12);
    }

    .task-name {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--warning);
      font-size: 13px;
      white-space: nowrap;
    }

    .done {
      color: var(--success);
      font-weight: 700;
    }

    .main {
      min-width: 0;
      overflow-y: auto;
      padding: 28px 34px 36px;
    }

    .task-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      color: white;
      font-size: 28px;
      line-height: 1.2;
    }

    .description,
    .theory,
    .hint-box,
    .empty {
      color: var(--text);
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .description {
      margin-bottom: 18px;
    }

    .section {
      margin: 18px 0;
      border-top: 1px solid var(--border);
      padding-top: 18px;
    }

    .section-title {
      margin: 0 0 10px;
      color: white;
      font-size: 16px;
    }

    details {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      padding: 12px 14px;
    }

    summary {
      color: var(--accent);
      font-weight: 700;
      cursor: pointer;
    }

    .hint-box {
      display: grid;
      gap: 10px;
      margin-bottom: 12px;
    }

    .hint {
      border-left: 3px solid var(--accent);
      border-radius: 0 6px 6px 0;
      background: var(--panel);
      padding: 10px 12px;
    }

    .editor-shell {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--code);
    }

    #editor {
      min-height: 260px;
      font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
    }

    .cm-editor {
      min-height: 260px;
      font-size: 15px;
    }

    .cm-scroller {
      font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0 0;
    }

    .primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #11111b;
      font-weight: 700;
    }

    .verdict {
      display: none;
      margin-top: 18px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      font-weight: 700;
    }

    .verdict.success {
      display: block;
      border-color: var(--success);
      background: rgba(166, 227, 161, 0.08);
      color: var(--success);
    }

    .verdict.error {
      display: block;
      border-color: var(--error);
      background: rgba(243, 139, 168, 0.08);
      color: var(--error);
    }

    .result-wrap {
      overflow-x: auto;
      margin-top: 18px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }

    table {
      width: 100%;
      min-width: 520px;
      border-collapse: collapse;
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 14px;
    }

    th,
    td {
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #181825;
      color: var(--accent);
      font-weight: 700;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .status {
      margin: 14px 0;
      color: var(--muted);
    }

    .error-text {
      color: var(--error);
    }

    @media (max-width: 850px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        max-height: 42vh;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .main {
        padding: 22px 18px 30px;
      }

      .task-header {
        display: block;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h2 class="brand">SQL Trainer</h2>
      <div id="taskList" class="status">Загрузка заданий...</div>
    </aside>

    <main class="main">
      <div id="emptyState" class="empty">Выберите задание слева.</div>
      <div id="workspace" hidden>
        <div class="task-header">
          <h1 id="taskTitle"></h1>
        </div>

        <div id="taskDescription" class="description"></div>

        <details class="section">
          <summary>Теория</summary>
          <div id="taskTheory" class="theory"></div>
        </details>

        <section class="section">
          <h2 class="section-title">Подсказки</h2>
          <div id="hintBox" class="hint-box"></div>
          <button id="showHintBtn" type="button">Показать подсказку</button>
        </section>

        <section class="section">
          <h2 class="section-title">SQL-запрос</h2>
          <div class="editor-shell">
            <div id="editor"></div>
          </div>
          <div class="actions">
            <button id="runBtn" type="button">Выполнить</button>
            <button id="checkBtn" class="primary" type="button">Проверить ответ</button>
          </div>
        </section>

        <div id="status" class="status"></div>
        <div id="verdict" class="verdict"></div>
        <div id="result" class="result-wrap" hidden></div>
      </div>
    </main>
  </div>

  <script type="module">
    import { basicSetup, EditorView } from "https://esm.sh/codemirror@6.0.1";
    import { sql } from "https://esm.sh/@codemirror/lang-sql@6.8.0";

    const taskListEl = document.querySelector("#taskList");
    const workspaceEl = document.querySelector("#workspace");
    const emptyStateEl = document.querySelector("#emptyState");
    const titleEl = document.querySelector("#taskTitle");
    const descriptionEl = document.querySelector("#taskDescription");
    const theoryEl = document.querySelector("#taskTheory");
    const hintBoxEl = document.querySelector("#hintBox");
    const showHintBtn = document.querySelector("#showHintBtn");
    const runBtn = document.querySelector("#runBtn");
    const checkBtn = document.querySelector("#checkBtn");
    const statusEl = document.querySelector("#status");
    const verdictEl = document.querySelector("#verdict");
    const resultEl = document.querySelector("#result");

    const completedKey = "sql-trainer-completed-tasks";
    const editorTheme = EditorView.theme({
      "&": {
        backgroundColor: "#181825",
        color: "#cdd6f4"
      },
      ".cm-content": {
        caretColor: "#89b4fa",
        padding: "14px 0"
      },
      ".cm-gutters": {
        backgroundColor: "#181825",
        borderRight: "1px solid #45475a",
        color: "#6c7086"
      },
      ".cm-activeLine": {
        backgroundColor: "rgba(137, 180, 250, 0.08)"
      },
      ".cm-activeLineGutter": {
        backgroundColor: "rgba(137, 180, 250, 0.08)"
      },
      ".cm-selectionBackground": {
        backgroundColor: "rgba(137, 180, 250, 0.28) !important"
      }
    }, { dark: true });

    let tasks = [];
    let currentTask = null;
    let revealedHints = 0;
    const editor = new EditorView({
      doc: "",
      extensions: [basicSetup, sql(), editorTheme],
      parent: document.querySelector("#editor")
    });

    function getCompleted() {
      try {
        return new Set(JSON.parse(localStorage.getItem(completedKey) || "[]"));
      } catch (error) {
        return new Set();
      }
    }

    function setCompleted(taskId) {
      const completed = getCompleted();
      completed.add(taskId);
      localStorage.setItem(completedKey, JSON.stringify([...completed]));
    }

    function stars(count) {
      return "★".repeat(count);
    }

    function groupByTopic(items) {
      return items.reduce((groups, task) => {
        groups[task.topic] ||= [];
        groups[task.topic].push(task);
        return groups;
      }, {});
    }

    function renderTaskList() {
      const completed = getCompleted();
      const groups = groupByTopic(tasks);
      taskListEl.innerHTML = "";

      Object.entries(groups).forEach(([topic, topicTasks]) => {
        const title = document.createElement("h3");
        title.className = "topic-title";
        title.textContent = topic;
        taskListEl.append(title);

        const list = document.createElement("div");
        list.className = "task-list";

        topicTasks.forEach((task) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "task-item";
          if (currentTask?.id === task.id) button.classList.add("active");
          button.addEventListener("click", () => loadTask(task.id));

          const name = document.createElement("span");
          name.className = "task-name";
          name.textContent = task.title;

          const meta = document.createElement("span");
          meta.className = "task-meta";
          meta.innerHTML = `${stars(task.difficulty)} ${
            completed.has(task.id) ? '<span class="done">✓</span>' : ""
          }`;

          button.append(name, meta);
          list.append(button);
        });

        taskListEl.append(list);
      });
    }

    function setEditorValue(value) {
      editor.dispatch({
        changes: { from: 0, to: editor.state.doc.length, insert: value }
      });
    }

    function getEditorValue() {
      return editor.state.doc.toString();
    }

    function clearOutput() {
      statusEl.textContent = "";
      statusEl.classList.remove("error-text");
      verdictEl.className = "verdict";
      verdictEl.textContent = "";
      resultEl.hidden = true;
      resultEl.innerHTML = "";
    }

    function renderHints() {
      hintBoxEl.innerHTML = "";
      const hints = currentTask?.hints || [];

      hints.slice(0, revealedHints).forEach((hintText) => {
        const hint = document.createElement("div");
        hint.className = "hint";
        hint.textContent = hintText;
        hintBoxEl.append(hint);
      });

      showHintBtn.disabled = revealedHints >= hints.length;
      showHintBtn.textContent = hints.length === 0
        ? "Подсказок нет"
        : "Показать подсказку";
    }

    function renderTable(columns, rows) {
      if (!columns.length && !rows.length) {
        resultEl.hidden = false;
        resultEl.innerHTML = '<div class="status">Запрос выполнен, строк нет.</div>';
        return;
      }

      const inferredColumns = columns.length
        ? columns
        : Array.from(
            { length: rows[0]?.length || 0 },
            (_, index) => `Колонка ${index + 1}`
          );

      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");
      inferredColumns.forEach((column) => {
        const th = document.createElement("th");
        th.textContent = column;
        headerRow.append(th);
      });
      thead.append(headerRow);

      const tbody = document.createElement("tbody");
      rows.forEach((row) => {
        const tr = document.createElement("tr");
        row.forEach((cell) => {
          const td = document.createElement("td");
          td.textContent = cell === null ? "NULL" : String(cell);
          tr.append(td);
        });
        tbody.append(tr);
      });

      table.append(thead, tbody);
      resultEl.hidden = false;
      resultEl.replaceChildren(table);
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, {
        headers: { "Content-Type": "application/json" },
        ...options
      });

      if (!response.ok) {
        throw new Error("Не удалось загрузить данные.");
      }

      return response.json();
    }

    async function loadTasks() {
      try {
        tasks = await requestJson("/api/v1/tasks");
        renderTaskList();
        if (tasks.length > 0) {
          await loadTask(tasks[0].id);
        } else {
          taskListEl.textContent = "Заданий пока нет.";
        }
      } catch (error) {
        taskListEl.textContent = "Не удалось загрузить задания.";
      }
    }

    async function loadTask(taskId) {
      clearOutput();
      statusEl.textContent = "Загрузка задания...";

      try {
        currentTask = await requestJson(`/api/v1/tasks/${taskId}`);
        titleEl.textContent = currentTask.title;
        descriptionEl.textContent = currentTask.description;
        theoryEl.textContent = currentTask.theory || "Теория для задания пока не добавлена.";
        revealedHints = 0;
        renderHints();
        setEditorValue("");
        emptyStateEl.hidden = true;
        workspaceEl.hidden = false;
        clearOutput();
        renderTaskList();
      } catch (error) {
        statusEl.textContent = "Не удалось загрузить задание.";
        statusEl.classList.add("error-text");
      }
    }

    async function runQuery() {
      clearOutput();
      statusEl.textContent = "Выполняем запрос...";

      try {
        const data = await requestJson("/api/v1/execute", {
          method: "POST",
          body: JSON.stringify({
            query: getEditorValue(),
            task_id: currentTask?.id
          })
        });

        if (data.error) {
          statusEl.textContent = data.error;
          statusEl.classList.add("error-text");
          return;
        }

        statusEl.textContent = `Готово. Строк: ${data.rows.length}.`;
        renderTable(data.columns, data.rows);
      } catch (error) {
        statusEl.textContent = "Не удалось выполнить запрос.";
        statusEl.classList.add("error-text");
      }
    }

    async function checkAnswer() {
      if (!currentTask) return;
      clearOutput();
      statusEl.textContent = "Проверяем ответ...";

      try {
        const data = await requestJson(`/api/v1/tasks/${currentTask.id}/check`, {
          method: "POST",
          body: JSON.stringify({ query: getEditorValue() })
        });

        verdictEl.className = `verdict ${data.correct ? "success" : "error"}`;
        verdictEl.textContent = data.correct || data.message.startsWith("Неверно")
          ? data.message
          : `Неверно. ${data.message}`;
        statusEl.textContent = "";
        renderTable([], data.got);

        if (data.correct) {
          setCompleted(currentTask.id);
          renderTaskList();
        }
      } catch (error) {
        statusEl.textContent = "Не удалось проверить ответ.";
        statusEl.classList.add("error-text");
      }
    }

    showHintBtn.addEventListener("click", () => {
      revealedHints += 1;
      renderHints();
    });
    runBtn.addEventListener("click", runQuery);
    checkBtn.addEventListener("click", checkAnswer);

    loadTasks();
  </script>
</body>
</html>
