solution: |
  SELECT h.name AS house_name, ROUND(AVG(c.age), 1) AS avg_age
  FROM houses h
  JOIN characters c ON c.house_id = h.id
  GROUP BY h.id, h.name
  HAVING AVG(c.age) > 30
  ORDER BY avg_age DESC
check:
  ordered: true
  columns_strict: true
hints:
  - "Сначала сгруппируй по дому и посчитай AVG(age)"
  - "Затем отфильтруй группы через HAVING AVG(c.age) > 30"
  - "Синтаксис: GROUP BY h.id, h.name HAVING AVG(c.age) > 30 ORDER BY avg_age DESC"
theory: |
  <h3 style="color:#89b4fa;margin:0 0 8px">HAVING с агрегатной функцией</h3>
  <p style="color:#cdd6f4;margin:0 0 10px">
    <code style="color:#a6e3a1">HAVING</code> фильтрует группы по результату агрегатной функции.
    В отличие от WHERE, здесь можно писать условия на <code>AVG</code>, <code>SUM</code>, <code>COUNT</code> и т.д.
  </p>
  <svg viewBox="0 0 420 155" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:420px;display:block;margin:0 0 12px">
    <rect width="420" height="155" rx="6" fill="#1e1e2e"/>
    <text x="16" y="18" fill="#cdd6f4" font-size="10" font-family="monospace">После GROUP BY — 9 групп с AVG(age):</text>
    <rect x="8" y="24" width="196" height="120" rx="3" fill="#313244"/>
    <text x="16" y="40" fill="#585b70" font-size="9" font-family="monospace">Дом Старков         21.8  ✗</text>
    <text x="16" y="54" fill="#a6e3a1" font-size="9" font-family="monospace">Дом Ланнистеров     37.0  ✓</text>
    <text x="16" y="68" fill="#585b70" font-size="9" font-family="monospace">Дом Таргариенов     19.0  ✗</text>
    <text x="16" y="82" fill="#585b70" font-size="9" font-family="monospace">Дом Баратеонов      26.0  ✗</text>
    <text x="16" y="96" fill="#585b70" font-size="9" font-family="monospace">Дом Грейджоев       19.0  ✗</text>
    <text x="16" y="110" fill="#a6e3a1" font-size="9" font-family="monospace">Дом Тиреллов        43.0  ✓</text>
    <text x="16" y="124" fill="#a6e3a1" font-size="9" font-family="monospace">Дом Мартеллов       38.5  ✓</text>
    <text x="16" y="138" fill="#585b70" font-size="9" font-family="monospace">Дом Талли           30.0  ✗ (= 30, не > 30)</text>
    <text x="196" y="80" fill="#89b4fa" font-size="18">→</text>
    <text x="189" y="96" fill="#89b4fa" font-size="7" font-family="monospace" text-anchor="middle">HAVING</text>
    <text x="189" y="107" fill="#89b4fa" font-size="7" font-family="monospace" text-anchor="middle">AVG > 30</text>
    <rect x="216" y="24" width="196" height="76" rx="3" fill="#2a3a2a" stroke="#a6e3a1"/>
    <text x="224" y="40" fill="#a6e3a1" font-size="9" font-family="monospace">house_name       avg_age</text>
    <text x="224" y="56" fill="#a6e3a1" font-size="9" font-family="monospace">Дом Тиреллов     43.0</text>
    <text x="224" y="70" fill="#a6e3a1" font-size="9" font-family="monospace">Дом Мартеллов    38.5</text>
    <text x="224" y="84" fill="#a6e3a1" font-size="9" font-family="monospace">Дом Ланнистеров  37.0</text>
    <text x="224" y="98" fill="#a6e3a1" font-size="9" font-family="monospace">Дом Болтонов     32.5</text>
    <text x="316" y="118" text-anchor="middle" fill="#585b70" font-size="8">4 дома прошли фильтр</text>
    <text x="316" y="132" text-anchor="middle" fill="#f38ba8" font-size="8">Дом Талли (30.0) не прошёл — не строго больше</text>
  </svg>
  <div style="border-left:3px solid #89b4fa;padding:8px 12px;background:#1e1e2e;border-radius:0 4px 4px 0">
    <strong style="color:#89b4fa">Запомни:</strong>
    <span style="color:#cdd6f4"> В HAVING можно использовать те же агрегатные функции, что и в SELECT, но повторять их вычисление не нужно — PostgreSQL достаточно умён, чтобы посчитать каждую функцию один раз.</span>
  </div>
