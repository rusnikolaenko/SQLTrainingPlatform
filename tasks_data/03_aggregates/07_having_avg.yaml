id: 23
topic: aggregates
difficulty: 4
title: "Дома со средним возрастом выше 30"
description: |
  Используй таблицы houses и characters.

  Задача: выбери дома, в которых средний возраст персонажей
  строго превышает 30 лет. Выведи название дома и средний возраст,
  округлённый до 1 знака.
  Отсортируй по убыванию среднего возраста.
  Колонки результата: house_name, avg_age.
