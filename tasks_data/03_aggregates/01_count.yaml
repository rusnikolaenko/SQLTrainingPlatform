solution: |
  SELECT h.name AS house_name, COUNT(c.id) AS character_count
  FROM houses h
  LEFT JOIN characters c ON c.house_id = h.id
  GROUP BY h.id, h.name
  ORDER BY character_count DESC, house_name ASC
check:
  ordered: true
  columns_strict: true
hints:
  - "Используй LEFT JOIN, чтобы дома без персонажей тоже попали в результат"
  - "COUNT(c.id) считает не-NULL значения — для домов без персонажей вернёт 0"
  - "Синтаксис: SELECT h.name AS house_name, COUNT(c.id) AS character_count FROM houses h LEFT JOIN characters c ON c.house_id = h.id GROUP BY h.id, h.name ORDER BY character_count DESC, house_name ASC"
theory: |
  <h3 style="color:#89b4fa;margin:0 0 8px">COUNT(*) и GROUP BY</h3>
  <p style="color:#cdd6f4;margin:0 0 10px">
    <code style="color:#a6e3a1">GROUP BY</code> разбивает строки на группы по уникальным значениям.
    Агрегатные функции вычисляют одно значение для каждой группы.
  </p>
  <svg viewBox="0 0 420 160" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:420px;display:block;margin:0 0 12px">
    <rect width="420" height="160" rx="6" fill="#1e1e2e"/>
    <text x="16" y="18" fill="#cdd6f4" font-size="10" font-family="monospace">Все строки characters:</text>
    <rect x="8" y="24" width="170" height="14" rx="2" fill="#313244"/>
    <text x="14" y="35" fill="#89b4fa" font-size="9" font-family="monospace">Эддард Старк  house_id=1</text>
    <rect x="8" y="40" width="170" height="14" rx="2" fill="#313244"/>
    <text x="14" y="51" fill="#89b4fa" font-size="9" font-family="monospace">Кейтилин Старк house_id=1</text>
    <rect x="8" y="56" width="170" height="14" rx="2" fill="#45475a"/>
    <text x="14" y="67" fill="#a6e3a1" font-size="9" font-family="monospace">Тирион Ланнист. house_id=2</text>
    <rect x="8" y="72" width="170" height="14" rx="2" fill="#45475a"/>
    <text x="14" y="83" fill="#a6e3a1" font-size="9" font-family="monospace">Серсея Ланнист. house_id=2</text>
    <rect x="8" y="88" width="170" height="14" rx="2" fill="#313244"/>
    <text x="14" y="99" fill="#fab387" font-size="9" font-family="monospace">Арья Старк    house_id=1</text>
    <text x="8" y="118" fill="#585b70" font-size="9" font-family="monospace">... ещё 20 строк ...</text>
    <text x="188" y="76" fill="#89b4fa" font-size="20">→</text>
    <text x="183" y="91" fill="#89b4fa" font-size="7" font-family="monospace" text-anchor="middle">GROUP BY</text>
    <text x="183" y="102" fill="#89b4fa" font-size="7" font-family="monospace" text-anchor="middle">house_id</text>
    <rect x="210" y="24" width="202" height="120" rx="4" fill="#1e1e2e" stroke="#45475a"/>
    <text x="218" y="40" fill="#89b4fa" font-size="9" font-family="monospace">house_name       count</text>
    <rect x="210" y="44" width="202" height="14" rx="2" fill="#313244"/>
    <text x="218" y="55" fill="#a6e3a1" font-size="9" font-family="monospace">Дом Старков        5</text>
    <rect x="210" y="60" width="202" height="14" rx="2" fill="#313244"/>
    <text x="218" y="71" fill="#a6e3a1" font-size="9" font-family="monospace">Дом Баратеонов     4</text>
    <rect x="210" y="76" width="202" height="14" rx="2" fill="#313244"/>
    <text x="218" y="87" fill="#a6e3a1" font-size="9" font-family="monospace">Дом Ланнистеров    4</text>
    <text x="311" y="120" text-anchor="middle" fill="#585b70" font-size="9">... ещё 7 домов ...</text>
    <rect x="210" y="128" width="202" height="14" rx="2" fill="#313244"/>
    <text x="218" y="139" fill="#a6e3a1" font-size="9" font-family="monospace">Дом Рейнов         0  ← LEFT JOIN</text>
  </svg>
  <table style="border-collapse:collapse;width:100%;font-family:monospace;font-size:12px;margin:0 0 12px">
    <tr style="background:#45475a">
      <th style="padding:5px 10px;color:#89b4fa;text-align:left">Функция</th>
      <th style="padding:5px 10px;color:#89b4fa;text-align:left">COUNT(*)</th>
      <th style="padding:5px 10px;color:#89b4fa;text-align:left">COUNT(col)</th>
    </tr>
    <tr style="background:#313244">
      <td style="padding:4px 10px;color:#cdd6f4">Считает</td>
      <td style="padding:4px 10px;color:#a6e3a1">все строки группы</td>
      <td style="padding:4px 10px;color:#a6e3a1">только не-NULL значения</td>
    </tr>
    <tr style="background:#2a2a3e">
      <td style="padding:4px 10px;color:#cdd6f4">NULL строки</td>
      <td style="padding:4px 10px;color:#fab387">включает</td>
      <td style="padding:4px 10px;color:#a6e3a1">исключает</td>
    </tr>
  </table>
  <div style="border-left:3px solid #89b4fa;padding:8px 12px;background:#1e1e2e;border-radius:0 4px 4px 0">
    <strong style="color:#89b4fa">Запомни:</strong>
    <span style="color:#cdd6f4"> При LEFT JOIN используй <code>COUNT(c.id)</code>, а не <code>COUNT(*)</code> — иначе дома без персонажей покажут 1 вместо 0 (из-за NULL-строки от LEFT JOIN).</span>
  </div>
