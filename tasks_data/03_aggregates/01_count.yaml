id: 17
topic: aggregates
difficulty: 2
title: "Сколько персонажей в каждом доме"
description: |
  Используй таблицы houses и characters.

  Задача: для каждого дома выведи название и количество
  принадлежащих ему персонажей, включая дома без персонажей (0).
  Отсортируй по убыванию числа персонажей, затем по названию дома по возрастанию.
  Колонки результата: house_name, character_count.
