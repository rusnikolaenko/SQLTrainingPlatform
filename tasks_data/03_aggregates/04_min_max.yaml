solution: |
  SELECT h.name AS house_name, MIN(c.age) AS youngest, MAX(c.age) AS oldest
  FROM houses h
  JOIN characters c ON c.house_id = h.id
  GROUP BY h.id, h.name
  ORDER BY house_name ASC
check:
  ordered: true
  columns_strict: true
hints:
  - "MIN(age) — минимальное значение в группе, MAX(age) — максимальное"
  - "INNER JOIN исключит дома без персонажей"
  - "Синтаксис: SELECT h.name AS house_name, MIN(c.age) AS youngest, MAX(c.age) AS oldest FROM houses h JOIN characters c ON c.house_id = h.id GROUP BY h.id, h.name ORDER BY house_name ASC"
theory: |
  <h3 style="color:#89b4fa;margin:0 0 8px">MIN и MAX по группам</h3>
  <p style="color:#cdd6f4;margin:0 0 10px">
    <code style="color:#a6e3a1">MIN(col)</code> и <code style="color:#a6e3a1">MAX(col)</code>
    находят наименьшее и наибольшее значение в каждой группе.
    Оба игнорируют <code>NULL</code>.
  </p>
