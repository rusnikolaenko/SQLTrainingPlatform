    <text x="33" y="51" text-anchor="middle" fill="#585b70" font-size="8">Эддард</text>
    <rect x="62" y="26" width="50" height="30" rx="3" fill="#313244"/>
    <text x="87" y="39" text-anchor="middle" fill="#cdd6f4" font-size="12" font-family="monospace">34</text>
    <text x="87" y="51" text-anchor="middle" fill="#585b70" font-size="8">Кейтилин</text>
    <rect x="116" y="26" width="50" height="30" rx="3" fill="#313244"/>
    <text x="141" y="39" text-anchor="middle" fill="#cdd6f4" font-size="12" font-family="monospace">16</text>
    <text x="141" y="51" text-anchor="middle" fill="#585b70" font-size="8">Робб</text>
    <rect x="170" y="26" width="50" height="30" rx="3" fill="#313244"/>
    <text x="195" y="39" text-anchor="middle" fill="#cdd6f4" font-size="12" font-family="monospace">13</text>
    <text x="195" y="51" text-anchor="middle" fill="#585b70" font-size="8">Санса</text>
    <rect x="224" y="26" width="50" height="30" rx="3" fill="#f38ba820" stroke="#f38ba8" stroke-width="1"/>
