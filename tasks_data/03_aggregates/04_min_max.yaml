    <text x="249" y="51" text-anchor="middle" fill="#f38ba8" font-size="8">Арья←MIN</text>
    <rect x="278" y="26" width="50" height="30" rx="3" fill="#a6e3a120" stroke="#a6e3a1" stroke-width="1"/>
    <text x="303" y="39" text-anchor="middle" fill="#a6e3a1" font-size="12" font-family="monospace">35</text>
    <text x="303" y="51" text-anchor="middle" fill="#a6e3a1" font-size="8">Эддард←MAX</text>
    <text x="16" y="82" fill="#cdd6f4" font-size="10" font-family="monospace">Дом Тиреллов — возрасты: 16, 70</text>
    <rect x="8" y="90" width="50" height="30" rx="3" fill="#f38ba820" stroke="#f38ba8" stroke-width="1"/>
    <text x="33" y="103" text-anchor="middle" fill="#f38ba8" font-size="12" font-family="monospace">16</text>
    <text x="33" y="115" text-anchor="middle" fill="#f38ba8" font-size="8">Маргери←MIN</text>
    <rect x="62" y="90" width="50" height="30" rx="3" fill="#a6e3a120" stroke="#a6e3a1" stroke-width="1"/>
    <text x="87" y="103" text-anchor="middle" fill="#a6e3a1" font-size="12" font-family="monospace">70</text>
    <text x="87" y="115" text-anchor="middle" fill="#a6e3a1" font-size="8">Оленна←MAX</text>
    <text x="16" y="142" fill="#585b70" font-size="9" font-family="monospace">MIN и MAX работают и со строками (TEXT), датами (DATE) — не только с числами</text>
  </svg>
  <div style="border-left:3px solid #89b4fa;padding:8px 12px;background:#1e1e2e;border-radius:0 4px 4px 0">
    <strong style="color:#89b4fa">Запомни:</strong>
    <span style="color:#cdd6f4"> Если в группе только одна строка, MIN и MAX вернут одно и то же значение. Если группа пустая или все значения NULL — вернут NULL.</span>
