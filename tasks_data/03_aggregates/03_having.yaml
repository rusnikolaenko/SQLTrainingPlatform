id: 19
topic: aggregates
difficulty: 3
title: "Дома с более чем 3 персонажами"
description: |
  Используй таблицы houses и characters.

  Задача: выбери только те дома, в которых насчитывается
  более 3 персонажей. Выведи название дома и число персонажей.
  Отсортируй по убыванию числа персонажей, затем по названию дома по возрастанию.
  Колонки результата: house_name, character_count.
