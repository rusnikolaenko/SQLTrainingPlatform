solution: |
  SELECT h.name AS house_name, COUNT(c.id) AS character_count
  FROM houses h
  JOIN characters c ON c.house_id = h.id
  GROUP BY h.id, h.name
  HAVING COUNT(c.id) > 3
  ORDER BY character_count DESC, house_name ASC
check:
  ordered: true
  columns_strict: true
hints:
  - "WHERE нельзя использовать с агрегатными функциями — для этого есть HAVING"
  - "HAVING применяется ПОСЛЕ группировки: HAVING COUNT(c.id) > 3"
  - "Синтаксис: GROUP BY h.id, h.name HAVING COUNT(c.id) > 3 ORDER BY character_count DESC, house_name ASC"
theory: |
  <h3 style="color:#89b4fa;margin:0 0 8px">WHERE vs HAVING — порядок выполнения</h3>
  <p style="color:#cdd6f4;margin:0 0 10px">
    <code style="color:#a6e3a1">WHERE</code> фильтрует <strong>строки до группировки</strong>.
    <code style="color:#a6e3a1">HAVING</code> фильтрует <strong>группы после группировки</strong>.
  </p>
  <svg viewBox="0 0 420 180" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:420px;display:block;margin:0 0 12px">
    <rect width="420" height="180" rx="6" fill="#1e1e2e"/>
    <rect x="8" y="8" width="80" height="164" rx="4" fill="#313244" stroke="#45475a"/>
    <text x="48" y="26" text-anchor="middle" fill="#cdd6f4" font-size="9" font-family="monospace">FROM</text>
    <text x="48" y="42" text-anchor="middle" fill="#585b70" font-size="8" font-family="monospace">25 строк</text>
    <text x="48" y="100" text-anchor="middle" fill="#585b70" font-size="20">⋮</text>
    <path d="M88 90 L108 90" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#ra)"/>
    <rect x="108" y="60" width="76" height="60" rx="4" fill="#3a2020" stroke="#f38ba8"/>
    <text x="146" y="82" text-anchor="middle" fill="#f38ba8" font-size="9" font-family="monospace">WHERE</text>
    <text x="146" y="96" text-anchor="middle" fill="#cdd6f4" font-size="8" font-family="monospace">фильтр строк</text>
    <text x="146" y="110" text-anchor="middle" fill="#cdd6f4" font-size="8" font-family="monospace">ДО группировки</text>
    <path d="M184 90 L204 90" stroke="#45475a" stroke-width="1.5" marker-end="url(#ra)"/>
    <rect x="204" y="60" width="72" height="60" rx="4" fill="#2a3a2a" stroke="#a6e3a1"/>
    <text x="240" y="82" text-anchor="middle" fill="#a6e3a1" font-size="9" font-family="monospace">GROUP BY</text>
    <text x="240" y="96" text-anchor="middle" fill="#cdd6f4" font-size="8" font-family="monospace">группировка</text>
    <text x="240" y="110" text-anchor="middle" fill="#cdd6f4" font-size="8" font-family="monospace">строк</text>
    <path d="M276 90 L296 90" stroke="#45475a" stroke-width="1.5" marker-end="url(#ra)"/>
    <rect x="296" y="60" width="76" height="60" rx="4" fill="#20203a" stroke="#89b4fa"/>
    <text x="334" y="82" text-anchor="middle" fill="#89b4fa" font-size="9" font-family="monospace">HAVING</text>
    <text x="334" y="96" text-anchor="middle" fill="#cdd6f4" font-size="8" font-family="monospace">фильтр групп</text>
    <text x="334" y="110" text-anchor="middle" fill="#cdd6f4" font-size="8" font-family="monospace">ПОСЛЕ группировки</text>
    <text x="146" y="148" text-anchor="middle" fill="#f38ba8" font-size="9" font-family="monospace">WHERE age > 18 ✓</text>
    <text x="334" y="148" text-anchor="middle" fill="#89b4fa" font-size="9" font-family="monospace">HAVING COUNT(*) > 3 ✓</text>
    <text x="146" y="162" text-anchor="middle" fill="#f38ba8" font-size="9" font-family="monospace">WHERE COUNT(*) > 3 ✗</text>
    <text x="334" y="162" text-anchor="middle" fill="#585b70" font-size="9" font-family="monospace">HAVING age > 18 ✗</text>
    <defs><marker id="ra" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#45475a"/></marker></defs>
  </svg>
  <pre style="background:#1e1e2e;padding:10px;border-radius:6px;color:#a6e3a1;font-size:13px;margin:0 0 12px;overflow-x:auto">-- Правильно: HAVING для условия на агрегат
  SELECT h.name AS house_name, COUNT(c.id) AS character_count
  FROM houses h JOIN characters c ON c.house_id = h.id
  GROUP BY h.id, h.name
  HAVING COUNT(c.id) > 3
  ORDER BY character_count DESC, house_name ASC;

  -- Ошибка: WHERE не знает о COUNT до группировки
  -- WHERE COUNT(c.id) > 3  ← синтаксическая ошибка!</pre>
  <div style="border-left:3px solid #89b4fa;padding:8px 12px;background:#1e1e2e;border-radius:0 4px 4px 0">
    <strong style="color:#89b4fa">Правило:</strong>
    <span style="color:#cdd6f4"> Условие на обычные колонки → <code>WHERE</code>. Условие на результат агрегатной функции → <code>HAVING</code>. Оба оператора можно использовать вместе в одном запросе.</span>
  </div>
