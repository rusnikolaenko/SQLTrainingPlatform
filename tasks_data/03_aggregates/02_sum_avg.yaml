solution: |
  SELECT h.name AS house_name, ROUND(AVG(c.age), 1) AS avg_age
  FROM characters c
  JOIN houses h ON c.house_id = h.id
  GROUP BY h.id, h.name
  ORDER BY avg_age DESC, house_name ASC
check:
  ordered: true
  columns_strict: true
hints:
  - "AVG(age) вычисляет среднее, ROUND(..., 1) округляет до одного знака после запятой"
  - "INNER JOIN исключит дома без персонажей (Дом Рейнов) — это и нужно по условию задачи"
  - "Синтаксис: SELECT h.name AS house_name, ROUND(AVG(c.age), 1) AS avg_age FROM characters c JOIN houses h ON c.house_id = h.id GROUP BY h.id, h.name ORDER BY avg_age DESC, house_name ASC"
theory: |
  <h3 style="color:#89b4fa;margin:0 0 8px">Агрегатные функции: SUM, AVG, MIN, MAX</h3>
  <p style="color:#cdd6f4;margin:0 0 10px">
    Агрегатные функции сворачивают набор строк в одно значение.
    Все они игнорируют <code>NULL</code> (кроме <code>COUNT(*)</code>).
  </p>
  <table style="border-collapse:collapse;width:100%;font-family:monospace;font-size:12px;margin:0 0 12px">
    <tr style="background:#45475a">
      <th style="padding:5px 10px;color:#89b4fa;text-align:left">Функция</th>
      <th style="padding:5px 10px;color:#89b4fa;text-align:left">Что считает</th>
      <th style="padding:5px 10px;color:#89b4fa;text-align:left">Пример</th>
    </tr>
    <tr style="background:#313244">
      <td style="padding:4px 10px;color:#a6e3a1">COUNT(*)</td>
      <td style="padding:4px 10px;color:#cdd6f4">все строки группы</td>
      <td style="padding:4px 10px;color:#fab387">COUNT(*) → 5</td>
    </tr>
    <tr style="background:#2a2a3e">
      <td style="padding:4px 10px;color:#a6e3a1">SUM(age)</td>
      <td style="padding:4px 10px;color:#cdd6f4">сумма значений</td>
      <td style="padding:4px 10px;color:#fab387">35+34+16+13+11 → 109</td>
    </tr>
    <tr style="background:#313244">
      <td style="padding:4px 10px;color:#a6e3a1">AVG(age)</td>
      <td style="padding:4px 10px;color:#cdd6f4">среднее значение</td>
      <td style="padding:4px 10px;color:#fab387">109/5 → 21.8</td>
    </tr>
    <tr style="background:#2a2a3e">
      <td style="padding:4px 10px;color:#a6e3a1">MIN(age)</td>
      <td style="padding:4px 10px;color:#cdd6f4">минимум в группе</td>
      <td style="padding:4px 10px;color:#fab387">min(35,34,16,13,11) → 11</td>
    </tr>
    <tr style="background:#313244">
      <td style="padding:4px 10px;color:#a6e3a1">MAX(age)</td>
      <td style="padding:4px 10px;color:#cdd6f4">максимум в группе</td>
      <td style="padding:4px 10px;color:#fab387">max(35,34,16,13,11) → 35</td>
    </tr>
  </table>
  <pre style="background:#1e1e2e;padding:10px;border-radius:6px;color:#a6e3a1;font-size:13px;margin:0 0 12px;overflow-x:auto">SELECT h.name AS house_name, ROUND(AVG(c.age), 1) AS avg_age
  FROM characters c
  JOIN houses h ON c.house_id = h.id
  GROUP BY h.id, h.name
  ORDER BY avg_age DESC, house_name ASC;</pre>
  <div style="border-left:3px solid #89b4fa;padding:8px 12px;background:#1e1e2e;border-radius:0 4px 4px 0">
    <strong style="color:#89b4fa">Запомни:</strong>
    <span style="color:#cdd6f4"> В <code>GROUP BY</code> нужно перечислить все не-агрегатные колонки из <code>SELECT</code>. Мы указываем <code>h.id, h.name</code>, а не только <code>h.name</code>, чтобы корректно группировать даже если два дома имеют одинаковые имена.</span>
  </div>
