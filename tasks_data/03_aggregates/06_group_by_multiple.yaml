solution: |
  SELECT h.name AS house_name, c.is_alive, COUNT(*) AS character_count
  FROM houses h
  JOIN characters c ON c.house_id = h.id
  GROUP BY h.id, h.name, c.is_alive
  ORDER BY house_name ASC, is_alive ASC
check:
  ordered: true
  columns_strict: true
hints:
  - "GROUP BY можно перечислить несколько колонок — группа создаётся для каждой уникальной комбинации"
  - "Добавь c.is_alive в GROUP BY и в SELECT"
  - "Синтаксис: GROUP BY h.id, h.name, c.is_alive ORDER BY house_name ASC, is_alive ASC"
theory: |
  <h3 style="color:#89b4fa;margin:0 0 8px">GROUP BY по нескольким колонкам</h3>
  <p style="color:#cdd6f4;margin:0 0 10px">
    При GROUP BY по нескольким колонкам группа создаётся для каждой
    <em>уникальной комбинации</em> всех перечисленных значений.
  </p>
  <svg viewBox="0 0 420 160" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:420px;display:block;margin:0 0 12px">
    <rect width="420" height="160" rx="6" fill="#1e1e2e"/>
    <text x="16" y="18" fill="#cdd6f4" font-size="10" font-family="monospace">GROUP BY house_name, is_alive → уникальные комбинации:</text>
    <rect x="8" y="24" width="404" height="16" rx="2" fill="#45475a"/>
    <text x="14" y="36" fill="#89b4fa" font-size="9" font-family="monospace">house_name              is_alive   character_count</text>
    <rect x="8" y="42" width="404" height="14" rx="2" fill="#313244"/>
    <text x="14" y="53" fill="#a6e3a1" font-size="9" font-family="monospace">Дом Баратеонов          false      4</text>
    <rect x="8" y="58" width="404" height="14" rx="2" fill="#313244"/>
    <text x="14" y="69" fill="#a6e3a1" font-size="9" font-family="monospace">Дом Болтонов            false      2</text>
    <rect x="8" y="74" width="404" height="14" rx="2" fill="#2a2a3e"/>
    <text x="14" y="85" fill="#a6e3a1" font-size="9" font-family="monospace">Дом Грейджоев           true       1</text>
    <rect x="8" y="90" width="404" height="14" rx="2" fill="#313244"/>
    <text x="14" y="101" fill="#a6e3a1" font-size="9" font-family="monospace">Дом Ланнистеров         false      2</text>
    <rect x="8" y="106" width="404" height="14" rx="2" fill="#2a2a3e"/>
    <text x="14" y="117" fill="#a6e3a1" font-size="9" font-family="monospace">Дом Ланнистеров         true       2</text>
    <text x="200" y="140" text-anchor="middle" fill="#585b70" font-size="9">... ещё 8 строк (13 всего — не у каждого дома оба статуса)</text>
  </svg>
  <pre style="background:#1e1e2e;padding:10px;border-radius:6px;color:#a6e3a1;font-size:13px;margin:0 0 12px;overflow-x:auto">SELECT h.name AS house_name, c.is_alive, COUNT(*) AS character_count
  FROM houses h
  JOIN characters c ON c.house_id = h.id
  GROUP BY h.id, h.name, c.is_alive
  ORDER BY house_name ASC, is_alive ASC;</pre>
  <div style="border-left:3px solid #89b4fa;padding:8px 12px;background:#1e1e2e;border-radius:0 4px 4px 0">
    <strong style="color:#89b4fa">Запомни:</strong>
    <span style="color:#cdd6f4"> Все колонки в SELECT, которые не являются агрегатными функциями, <strong>обязаны</strong> быть в GROUP BY. Если пропустить хотя бы одну — PostgreSQL выдаст ошибку.</span>
  </div>
