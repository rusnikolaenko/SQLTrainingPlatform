id: 22
topic: aggregates
difficulty: 3
title: "Живые и мёртвые по домам"
description: |
  Используй таблицы houses и characters.

  Задача: для каждой комбинации «дом + статус выживания» подсчитай
  количество персонажей. Включай только персонажей, у которых есть дом.
  Отсортируй по названию дома по возрастанию, затем по is_alive по возрастанию.
  Колонки результата: house_name, is_alive, character_count.
schema_setup: |
