solution: |
  SELECT COUNT(DISTINCT location) AS unique_locations
  FROM battles
check:
  ordered: false
  columns_strict: true
hints:
  - "COUNT(DISTINCT col) считает только уникальные значения, дубликаты игнорируются"
  - "Без GROUP BY результат — одна строка с глобальным подсчётом"
  - "Синтаксис: SELECT COUNT(DISTINCT location) AS unique_locations FROM battles"
theory: |
  <h3 style="color:#89b4fa;margin:0 0 8px">DISTINCT внутри агрегата</h3>
  <p style="color:#cdd6f4;margin:0 0 10px">
    <code style="color:#a6e3a1">COUNT(DISTINCT col)</code> считает количество
    <em>уникальных</em> не-NULL значений столбца. Дубликаты не учитываются.
  </p>
  <svg viewBox="0 0 420 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:420px;display:block;margin:0 0 12px">
    <rect width="420" height="130" rx="6" fill="#1e1e2e"/>
    <text x="16" y="18" fill="#cdd6f4" font-size="10" font-family="monospace">battles.location (10 строк):</text>
    <text x="16" y="36" fill="#cdd6f4" font-size="9" font-family="monospace">Речные земли, Кор. Гавань, Винтерфелл, Западные земли,</text>
    <text x="16" y="50" fill="#cdd6f4" font-size="9" font-family="monospace">Риверран, Винтерфелл, Простор, Пайк, Речные земли, Хайгарден</text>
    <rect x="8" y="58" width="196" height="30" rx="3" fill="#3a2020" stroke="#f38ba8" stroke-width="1"/>
    <text x="16" y="72" fill="#f38ba8" font-size="9" font-family="monospace">COUNT(location) = 10</text>
    <text x="16" y="84" fill="#585b70" font-size="8" font-family="monospace">считает все строки, включая повторы</text>
    <rect x="216" y="58" width="196" height="30" rx="3" fill="#2a3a2a" stroke="#a6e3a1" stroke-width="1"/>
    <text x="224" y="72" fill="#a6e3a1" font-size="9" font-family="monospace">COUNT(DISTINCT location) = 7</text>
    <text x="224" y="84" fill="#585b70" font-size="8" font-family="monospace">только уникальные значения</text>
    <text x="16" y="110" fill="#585b70" font-size="9" font-family="monospace">Уникальные: Речные земли, Кор. Гавань, Винтерфелл, Зап. земли, Риверран, Простор, Пайк, Хайгарден → 7</text>
  </svg>
  <pre style="background:#1e1e2e;padding:10px;border-radius:6px;color:#a6e3a1;font-size:13px;margin:0 0 12px;overflow-x:auto">-- DISTINCT можно использовать внутри любого агрегата:
  SELECT
    COUNT(DISTINCT location)       AS unique_locations,
    COUNT(DISTINCT attacker_house_id) AS unique_attackers,
    SUM(DISTINCT year)             AS sum_unique_years
  FROM battles;</pre>
  <div style="border-left:3px solid #89b4fa;padding:8px 12px;background:#1e1e2e;border-radius:0 4px 4px 0">
    <strong style="color:#89b4fa">Запомни:</strong>
    <span style="color:#cdd6f4"> <code>COUNT(DISTINCT col)</code> ≠ <code>COUNT(col)</code> — первый даёт число уникальных значений, второй — общее число не-NULL значений. <code>SUM(DISTINCT col)</code> суммирует только уникальные значения (редко нужно).</span>
  </div>
