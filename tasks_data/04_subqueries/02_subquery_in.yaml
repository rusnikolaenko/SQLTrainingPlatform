solution: |
  SELECT name FROM characters
  WHERE house_id IN (SELECT winner_house_id FROM battles)
check:
  ordered: false
  columns_strict: true
hints:
  - "IN позволяет проверить, входит ли значение во множество, возвращаемое подзапросом"
  - "Подзапрос: SELECT winner_house_id FROM battles — возвращает id домов-победителей"
  - "Синтаксис: WHERE house_id IN (SELECT winner_house_id FROM battles)"
theory: |
  <h3 style="color:#89b4fa;margin:0 0 8px">Подзапрос с IN</h3>
  <p style="color:#cdd6f4;margin:0 0 10px">
    <code style="color:#a6e3a1">IN (подзапрос)</code> проверяет, присутствует ли значение
    в множестве строк, возвращённых подзапросом.
  </p>
  <pre style="background:#1e1e2e;padding:10px;border-radius:6px;color:#a6e3a1;font-size:13px;margin:0 0 12px;overflow-x:auto">-- Подзапрос с IN
  SELECT name FROM characters
  WHERE house_id IN (SELECT winner_house_id FROM battles);

  -- Эквивалент через JOIN (часто быстрее при большом наборе)
  SELECT DISTINCT c.name FROM characters c
  JOIN battles b ON c.house_id = b.winner_house_id;</pre>
  <svg viewBox="0 0 420 140" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:420px;display:block;margin:0 0 12px">
    <rect width="420" height="140" rx="6" fill="#1e1e2e"/>
    <text x="16" y="22" fill="#cdd6f4" font-size="10" font-family="monospace">Подзапрос возвращает набор winner_house_id:</text>
    <rect x="8" y="28" width="404" height="20" rx="3" fill="#313244"/>
    <text x="16" y="42" fill="#fab387" font-size="10" font-family="monospace">{ 1, 2, 9, 1, 2, 1, 3, 4, 2, 2 }  →  уникальные: { 1, 2, 3, 4, 9 }</text>
    <text x="16" y="66" fill="#cdd6f4" font-size="10" font-family="monospace">Внешний запрос: house_id IN { 1, 2, 3, 4, 9 }</text>
    <rect x="8" y="72" width="190" height="16" rx="2" fill="#313244"/>
    <text x="14" y="84" fill="#a6e3a1" font-size="9" font-family="monospace">✓ Эддард Старк  (house_id=1)</text>
    <rect x="8" y="90" width="190" height="16" rx="2" fill="#313244"/>
    <text x="14" y="102" fill="#a6e3a1" font-size="9" font-family="monospace">✓ Тирион Ланнистер (house_id=2)</text>
    <rect x="8" y="108" width="190" height="16" rx="2" fill="#313244"/>
    <text x="14" y="120" fill="#585b70" font-size="9" font-family="monospace">✗ Теон Грейджой (house_id=5) — нет в наборе</text>
    <rect x="210" y="72" width="202" height="58" rx="4" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1"/>
    <text x="218" y="86" fill="#89b4fa" font-size="9" font-family="monospace">IN vs JOIN:</text>
    <text x="218" y="100" fill="#cdd6f4" font-size="9" font-family="monospace">IN — проще читается</text>
    <text x="218" y="114" fill="#cdd6f4" font-size="9" font-family="monospace">JOIN — нужен DISTINCT если дубли</text>
    <text x="218" y="128" fill="#cdd6f4" font-size="9" font-family="monospace">JOIN — часто оптимальнее</text>
  </svg>
  <div style="border-left:3px solid #89b4fa;padding:8px 12px;background:#1e1e2e;border-radius:0 4px 4px 0">
    <strong style="color:#89b4fa">Запомни:</strong>
    <span style="color:#cdd6f4"> <code>IN (подзапрос)</code> и <code>JOIN + DISTINCT</code> дают одинаковый результат, но JOIN даёт доступ к колонкам второй таблицы в SELECT. Используй IN, когда нужна только фильтрация.</span>
  </div>
