solution: |
  SELECT name FROM characters
  WHERE EXISTS (
      SELECT 1 FROM dragon_sightings WHERE witness_id = characters.id
  )
check:
  ordered: false
  columns_strict: true
hints:
  - "EXISTS проверяет: есть ли хотя бы одна строка в подзапросе?"
  - "В подзапросе нужна связь с внешней таблицей: WHERE witness_id = characters.id"
  - "Синтаксис: WHERE EXISTS (SELECT 1 FROM dragon_sightings WHERE witness_id = characters.id)"
theory: |
  <h3 style="color:#89b4fa;margin:0 0 8px">EXISTS — проверка существования</h3>
  <p style="color:#cdd6f4;margin:0 0 10px">
    <code style="color:#a6e3a1">EXISTS (подзапрос)</code> возвращает TRUE, если подзапрос
    вернул хотя бы одну строку. Содержимое строки не важно — поэтому пишут <code>SELECT 1</code>.
  </p>
  <pre style="background:#1e1e2e;padding:10px;border-radius:6px;color:#a6e3a1;font-size:13px;margin:0 0 12px;overflow-x:auto">SELECT name FROM characters
  WHERE EXISTS (
      SELECT 1 FROM dragon_sightings
      WHERE witness_id = characters.id   -- связь с внешней строкой
  );</pre>
  <svg viewBox="0 0 420 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:420px;display:block;margin:0 0 12px">
    <rect width="420" height="150" rx="6" fill="#1e1e2e"/>
    <text x="16" y="20" fill="#cdd6f4" font-size="10" font-family="monospace">Для каждой строки characters PostgreSQL спрашивает:</text>
    <rect x="8" y="28" width="404" height="24" rx="3" fill="#313244"/>
    <text x="16" y="44" fill="#89b4fa" font-size="10" font-family="monospace">«Есть ли запись в dragon_sightings с witness_id = текущий id?»</text>
    <rect x="8" y="58" width="190" height="36" rx="3" fill="#2a3a2a"/>
    <text x="16" y="74" fill="#a6e3a1" font-size="9" font-family="monospace">✓ Дейенерис (id=10)</text>
    <text x="16" y="88" fill="#a6e3a1" font-size="9" font-family="monospace">  → sighting id=1 → EXISTS = TRUE</text>
    <rect x="8" y="98" width="190" height="36" rx="3" fill="#3a2a2a"/>
    <text x="16" y="114" fill="#f38ba8" font-size="9" font-family="monospace">✗ Тайвин (id=9)</text>
    <text x="16" y="128" fill="#f38ba8" font-size="9" font-family="monospace">  → нет записей → EXISTS = FALSE</text>
    <rect x="210" y="58" width="202" height="76" rx="4" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1"/>
    <text x="218" y="73" fill="#89b4fa" font-size="9" font-family="monospace" font-weight="bold">EXISTS vs IN</text>
    <text x="218" y="89" fill="#a6e3a1" font-size="9" font-family="monospace">EXISTS останавливается</text>
    <text x="218" y="103" fill="#a6e3a1" font-size="9" font-family="monospace">при первом совпадении →</text>
    <text x="218" y="117" fill="#a6e3a1" font-size="9" font-family="monospace">быстрее на больших данных</text>
    <text x="218" y="131" fill="#cdd6f4" font-size="9" font-family="monospace">IN читает весь подзапрос</text>
  </svg>
  <div style="border-left:3px solid #89b4fa;padding:8px 12px;background:#1e1e2e;border-radius:0 4px 4px 0">
    <strong style="color:#89b4fa">Запомни:</strong>
    <span style="color:#cdd6f4"> EXISTS всегда коррелированный — подзапрос ссылается на строку внешнего запроса. При этом NULL в данных не создаёт проблем: EXISTS смотрит только на наличие строк, а не на значения.</span>
  </div>
