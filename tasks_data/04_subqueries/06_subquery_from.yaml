    <text x="16" y="18" fill="#89b4fa" font-size="10" font-family="monospace" font-weight="bold">Порядок выполнения</text>
    <rect x="8" y="24" width="404" height="46" rx="3" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
    <text x="16" y="40" fill="#a6e3a1" font-size="9" font-family="monospace" font-weight="bold">① Подзапрос в FROM — строит house_stats:</text>
    <text x="16" y="56" fill="#cdd6f4" font-size="9" font-family="monospace">  house_name=«Дом Тиреллов», avg_age=43.0</text>
    <text x="16" y="64" fill="#585b70" font-size="9" font-family="monospace">  ... (10 домов со своими avg)</text>
    <rect x="8" y="76" width="196" height="38" rx="3" fill="#313244" stroke="#fab387" stroke-width="1"/>
    <text x="16" y="90" fill="#fab387" font-size="9" font-family="monospace" font-weight="bold">② Скалярный подзапрос:</text>
    <text x="16" y="104" fill="#cdd6f4" font-size="9" font-family="monospace">  AVG(age) всех 25 → 29.44</text>
    <rect x="216" y="76" width="196" height="38" rx="3" fill="#313244" stroke="#89b4fa" stroke-width="1"/>
    <text x="224" y="90" fill="#89b4fa" font-size="9" font-family="monospace" font-weight="bold">③ Внешний WHERE:</text>
    <text x="224" y="104" fill="#cdd6f4" font-size="9" font-family="monospace">  avg_age > 29.44 → 5 домов</text>
    <text x="16" y="130" fill="#cdd6f4" font-size="9" font-family="monospace">Результат (отсортировано по avg_age DESC):</text>
    <text x="16" y="144" fill="#a6e3a1" font-size="9" font-family="monospace">  Дом Тиреллов 43.00 | Дом Мартеллов 38.50</text>
    <text x="16" y="158" fill="#a6e3a1" font-size="9" font-family="monospace">  Дом Ланнистеров 37.00 | Болтоны 32.50 | Талли 30.00</text>
  </svg>
  <pre style="background:#1e1e2e;padding:10px;border-radius:6px;color:#a6e3a1;font-size:13px;margin:0 0 12px;overflow-x:auto">SELECT house_name, ROUND(avg_age, 2) AS avg_age
  FROM (
      SELECT h.name AS house_name, AVG(c.age) AS avg_age
      FROM houses h
      JOIN characters c ON c.house_id = h.id
      GROUP BY h.id, h.name
  ) AS house_stats
  WHERE avg_age > (SELECT AVG(age) FROM characters)
  ORDER BY avg_age DESC;</pre>
  <div style="border-left:3px solid #89b4fa;padding:8px 12px;background:#1e1e2e;border-radius:0 4px 4px 0">
    <strong style="color:#89b4fa">Запомни:</strong>
    <span style="color:#cdd6f4"> Подзапрос в FROM нельзя фильтровать через HAVING — это уже агрегированная таблица. Внешний WHERE фильтрует уже готовые строки derived table. Псевдоним обязателен.</span>
