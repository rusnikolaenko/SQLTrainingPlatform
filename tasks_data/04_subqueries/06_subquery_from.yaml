solution: |
  SELECT house_name, ROUND(avg_age, 2) AS avg_age
  FROM (
      SELECT h.name AS house_name, AVG(c.age) AS avg_age
      FROM houses h
      JOIN characters c ON c.house_id = h.id
      GROUP BY h.id, h.name
  ) AS house_stats
  WHERE avg_age > (SELECT AVG(age) FROM characters)
  ORDER BY avg_age DESC
check:
  ordered: true
  columns_strict: true
hints:
  - "Сначала посчитай средний возраст по каждому дому — это подзапрос в FROM"
  - "Общее среднее — это отдельный скалярный подзапрос: (SELECT AVG(age) FROM characters)"
  - "Синтаксис: SELECT ... FROM (SELECT h.name, AVG(c.age) FROM houses h JOIN characters c ON c.house_id = h.id GROUP BY h.id, h.name) AS stats WHERE avg_age > (SELECT AVG(age) FROM characters)"
theory: |
  <h3 style="color:#89b4fa;margin:0 0 8px">Подзапрос в FROM (derived table)</h3>
  <p style="color:#cdd6f4;margin:0 0 10px">
    Подзапрос в <code style="color:#a6e3a1">FROM</code> создаёт временную таблицу (inline view),
    которую внешний запрос использует как обычную таблицу. Обязательно нужен псевдоним (<code>AS stats</code>).
  </p>
  <svg viewBox="0 0 420 170" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:420px;display:block;margin:0 0 12px">
