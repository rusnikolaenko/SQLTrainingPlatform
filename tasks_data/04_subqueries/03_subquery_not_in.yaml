solution: |
  SELECT name FROM houses
  WHERE id NOT IN (
      SELECT winner_house_id FROM battles WHERE winner_house_id IS NOT NULL
  )
check:
  ordered: false
  columns_strict: true
hints:
  - "NOT IN — это отрицание IN: выбери дома, чьи id нет среди победителей"
  - "Важно: добавь WHERE winner_house_id IS NOT NULL в подзапрос, иначе NOT IN вернёт пустой результат"
  - "Синтаксис: WHERE id NOT IN (SELECT winner_house_id FROM battles WHERE winner_house_id IS NOT NULL)"
theory: |
  <h3 style="color:#89b4fa;margin:0 0 8px">NOT IN и ловушка с NULL</h3>
  <p style="color:#cdd6f4;margin:0 0 10px">
    <code style="color:#a6e3a1">NOT IN</code> возвращает строки, значение которых <em>не входит</em>
    в набор. Но есть критически важный нюанс: если подзапрос вернул хотя бы одно <code>NULL</code>,
    <strong style="color:#f38ba8">NOT IN вернёт пустой результат</strong>.
  </p>
  <svg viewBox="0 0 420 160" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:420px;display:block;margin:0 0 12px">
    <rect width="420" height="160" rx="6" fill="#1e1e2e"/>
    <text x="16" y="22" fill="#f38ba8" font-size="10" font-family="monospace" font-weight="bold">⚠ Ловушка: winner_house_id содержит NULL</text>
    <rect x="8" y="30" width="196" height="58" rx="3" fill="#313244" stroke="#f38ba8" stroke-width="1"/>
    <text x="16" y="46" fill="#cdd6f4" font-size="9" font-family="monospace">БЕЗ IS NOT NULL:</text>
    <text x="16" y="60" fill="#f38ba8" font-size="9" font-family="monospace">NOT IN (1,2,9,1,2,1,3,4,2,2)</text>
    <text x="16" y="74" fill="#f38ba8" font-size="9" font-family="monospace">→ если есть NULL → пусто!</text>
    <text x="16" y="85" fill="#585b70" font-size="9" font-family="monospace">(нет NULL здесь, но привычка важна)</text>
    <rect x="216" y="30" width="196" height="58" rx="3" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
    <text x="224" y="46" fill="#cdd6f4" font-size="9" font-family="monospace">С IS NOT NULL:</text>
    <text x="224" y="60" fill="#a6e3a1" font-size="9" font-family="monospace">NOT IN (1,2,3,4,9) — без NULL</text>
    <text x="224" y="74" fill="#a6e3a1" font-size="9" font-family="monospace">→ дома 5,6,7,8,10 ✓</text>
    <text x="16" y="108" fill="#cdd6f4" font-size="10" font-family="monospace">Почему так? NULL — это «неизвестно».</text>
    <text x="16" y="124" fill="#cdd6f4" font-size="10" font-family="monospace">5 NOT IN {1, NULL}  →  5 ≠ 1 (TRUE), 5 ≠ NULL (UNKNOWN)</text>
    <text x="16" y="140" fill="#cdd6f4" font-size="10" font-family="monospace">TRUE AND UNKNOWN = UNKNOWN  →  строка не проходит фильтр</text>
  </svg>
  <pre style="background:#1e1e2e;padding:10px;border-radius:6px;color:#a6e3a1;font-size:13px;margin:0 0 12px;overflow-x:auto">-- Правильно: исключаем NULL из подзапроса
  SELECT name FROM houses
  WHERE id NOT IN (
      SELECT winner_house_id FROM battles
      WHERE winner_house_id IS NOT NULL
  );

  -- Альтернатива без ловушки: NOT EXISTS
  SELECT name FROM houses h
  WHERE NOT EXISTS (
      SELECT 1 FROM battles b WHERE b.winner_house_id = h.id
  );</pre>
  <div style="border-left:3px solid #f38ba8;padding:8px 12px;background:#1e1e2e;border-radius:0 4px 4px 0">
    <strong style="color:#f38ba8">Правило:</strong>
    <span style="color:#cdd6f4"> Всегда добавляй <code>WHERE колонка IS NOT NULL</code> в подзапрос при использовании NOT IN. Либо замени NOT IN на NOT EXISTS — он безопасен для NULL.</span>
  </div>
