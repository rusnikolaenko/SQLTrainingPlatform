solution: |
  SELECT c1.name, c1.age, h.name AS house_name
  FROM characters c1
  JOIN houses h ON c1.house_id = h.id
  WHERE c1.age > (
      SELECT AVG(c2.age) FROM characters c2 WHERE c2.house_id = c1.house_id
  )
  ORDER BY c1.age DESC
check:
  ordered: true
  columns_strict: true
hints:
  - "Коррелированный подзапрос — это подзапрос, который ссылается на строку внешнего запроса"
  - "Внутри подзапроса фильтруй по c2.house_id = c1.house_id — это и есть корреляция"
  - "Синтаксис: WHERE c1.age > (SELECT AVG(c2.age) FROM characters c2 WHERE c2.house_id = c1.house_id)"
theory: |
  <h3 style="color:#89b4fa;margin:0 0 8px">Коррелированный подзапрос</h3>
  <p style="color:#cdd6f4;margin:0 0 10px">
    Коррелированный подзапрос ссылается на строку <em>внешнего</em> запроса.
    Он <strong>выполняется заново для каждой строки</strong> внешнего запроса.
  </p>
  <svg viewBox="0 0 420 175" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:420px;display:block;margin:0 0 12px">
    <rect width="420" height="175" rx="6" fill="#1e1e2e"/>
    <text x="16" y="18" fill="#89b4fa" font-size="10" font-family="monospace" font-weight="bold">Выполнение строка за строкой:</text>
    <rect x="8" y="24" width="404" height="34" rx="3" fill="#313244"/>
    <text x="16" y="38" fill="#cdd6f4" font-size="9" font-family="monospace">Строка: Эддард Старк, house_id=1, age=35</text>
    <text x="16" y="52" fill="#fab387" font-size="9" font-family="monospace">  → подзапрос: AVG(age) WHERE house_id=1 = 21.8  →  35 > 21.8 ✓</text>
    <rect x="8" y="62" width="404" height="34" rx="3" fill="#313244"/>
    <text x="16" y="76" fill="#cdd6f4" font-size="9" font-family="monospace">Строка: Арья Старк, house_id=1, age=11</text>
    <text x="16" y="90" fill="#585b70" font-size="9" font-family="monospace">  → подзапрос: AVG(age) WHERE house_id=1 = 21.8  →  11 > 21.8 ✗</text>
    <rect x="8" y="100" width="404" height="34" rx="3" fill="#313244"/>
    <text x="16" y="114" fill="#cdd6f4" font-size="9" font-family="monospace">Строка: Тайвин Ланнистер, house_id=2, age=58</text>
    <text x="16" y="128" fill="#fab387" font-size="9" font-family="monospace">  → подзапрос: AVG(age) WHERE house_id=2 = 37.0  →  58 > 37.0 ✓</text>
    <text x="16" y="150" fill="#89b4fa" font-size="9" font-family="monospace">↑ house_id меняется с каждой строкой — это и есть корреляция</text>
    <text x="16" y="164" fill="#585b70" font-size="9" font-family="monospace">Итог: 9 персонажей (Эддард, Кейтилин, Тайвин, Визерис, Роберт, Станнис...)</text>
  </svg>
  <pre style="background:#1e1e2e;padding:10px;border-radius:6px;color:#a6e3a1;font-size:13px;margin:0 0 12px;overflow-x:auto">SELECT c1.name, c1.age, h.name AS house_name
  FROM characters c1
  JOIN houses h ON c1.house_id = h.id
  WHERE c1.age > (
      SELECT AVG(c2.age)
      FROM characters c2
      WHERE c2.house_id = c1.house_id  -- ← корреляция
  )
  ORDER BY c1.age DESC;</pre>
  <div style="border-left:3px solid #fab387;padding:8px 12px;background:#1e1e2e;border-radius:0 4px 4px 0">
    <strong style="color:#fab387">Производительность:</strong>
    <span style="color:#cdd6f4"> Коррелированный подзапрос выполняется N раз (по числу строк). На больших таблицах лучше заменить на JOIN с агрегатом или оконные функции (<code>AVG() OVER (PARTITION BY house_id)</code>).</span>
  </div>
