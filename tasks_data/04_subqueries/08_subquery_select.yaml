solution: |
  SELECT name,
         (SELECT COUNT(*) FROM characters c WHERE c.house_id = h.id) AS character_count
  FROM houses h
  ORDER BY character_count DESC, name ASC
check:
  ordered: true
  columns_strict: true
hints:
  - "Скалярный подзапрос в SELECT возвращает ровно одно значение для каждой строки"
  - "Подзапрос: (SELECT COUNT(*) FROM characters c WHERE c.house_id = h.id)"
  - "Синтаксис: SELECT name, (SELECT COUNT(*) FROM characters c WHERE c.house_id = h.id) AS character_count FROM houses h ORDER BY character_count DESC, name ASC"
theory: |
  <h3 style="color:#89b4fa;margin:0 0 8px">Скалярный подзапрос в SELECT</h3>
  <p style="color:#cdd6f4;margin:0 0 10px">
    Скалярный подзапрос в списке <code style="color:#a6e3a1">SELECT</code> вычисляет
    одно значение для каждой строки результата. По сути это тоже коррелированный подзапрос.
  </p>
  <pre style="background:#1e1e2e;padding:10px;border-radius:6px;color:#a6e3a1;font-size:13px;margin:0 0 12px;overflow-x:auto">SELECT
    name,
    (SELECT COUNT(*)            -- ← скалярный подзапрос
     FROM characters c
     WHERE c.house_id = h.id   -- корреляция с h
    ) AS character_count
  FROM houses h
  ORDER BY character_count DESC, name ASC;</pre>
  <svg viewBox="0 0 420 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:420px;display:block;margin:0 0 12px">
    <rect width="420" height="150" rx="6" fill="#1e1e2e"/>
    <text x="16" y="18" fill="#cdd6f4" font-size="10" font-family="monospace">Для каждой строки houses подзапрос считает персонажей:</text>
    <rect x="8" y="24" width="404" height="18" rx="2" fill="#313244"/>
    <text x="16" y="37" fill="#89b4fa" font-size="9" font-family="monospace">name               character_count</text>
    <rect x="8" y="44" width="404" height="14" rx="2" fill="#2a3a2a"/>
    <text x="16" y="55" fill="#a6e3a1" font-size="9" font-family="monospace">Дом Старков        5  ← COUNT(*) WHERE house_id=1</text>
    <rect x="8" y="60" width="404" height="14" rx="2" fill="#313244"/>
    <text x="16" y="71" fill="#a6e3a1" font-size="9" font-family="monospace">Дом Ланнистеров    4  ← COUNT(*) WHERE house_id=2</text>
    <rect x="8" y="76" width="404" height="14" rx="2" fill="#313244"/>
    <text x="16" y="87" fill="#a6e3a1" font-size="9" font-family="monospace">Дом Баратеонов     4  ← COUNT(*) WHERE house_id=4</text>
    <text x="200" y="108" text-anchor="middle" fill="#585b70" font-size="9">... ещё 7 домов ...</text>
    <rect x="8" y="116" width="404" height="14" rx="2" fill="#313244"/>
    <text x="16" y="127" fill="#a6e3a1" font-size="9" font-family="monospace">Дом Рейнов         0  ← COUNT(*) WHERE house_id=10 — нет персонажей</text>
    <text x="16" y="144" fill="#585b70" font-size="8" font-family="monospace">Скалярный подзапрос ДОЛЖЕН возвращать ровно 1 строку (или NULL). COUNT всегда выполняет это условие.</text>
  </svg>
  <div style="border-left:3px solid #89b4fa;padding:8px 12px;background:#1e1e2e;border-radius:0 4px 4px 0;margin:0 0 10px">
    <strong style="color:#89b4fa">Запомни:</strong>
    <span style="color:#cdd6f4"> Скалярный подзапрос должен возвращать строго одну строку и один столбец. Если вернёт больше одной строки — PostgreSQL выдаст ошибку <em>«more than one row returned by a subquery»</em>.</span>
  </div>
  <div style="border-left:3px solid #a6e3a1;padding:8px 12px;background:#1e1e2e;border-radius:0 4px 4px 0">
    <strong style="color:#a6e3a1">Альтернатива:</strong>
    <span style="color:#cdd6f4"> LEFT JOIN + COUNT(*) + GROUP BY быстрее на больших таблицах, но скалярный подзапрос проще читается и позволяет получать агрегаты без изменения GROUP BY внешнего запроса.</span>
  </div>
