id: 25
topic: subqueries
difficulty: 3
title: "Персонажи из самого большого дома"
description: |
  Используй таблицы characters и houses.

  Задача: выбери name всех персонажей, принадлежащих
  к дому с наибольшим количеством членов.
  Используй подзапрос в WHERE.
  Порядок строк не важен.
schema_setup: |
  CREATE TABLE houses (
      id INTEGER PRIMARY KEY,
      name TEXT, words TEXT, region TEXT, is_great BOOLEAN
  );
  CREATE TABLE characters (
      id INTEGER PRIMARY KEY,
      name TEXT, house_id INTEGER REFERENCES houses(id),
      title TEXT, age INTEGER, is_alive BOOLEAN
  );
  CREATE TABLE battles (
      id INTEGER PRIMARY KEY,
      name TEXT, year INTEGER,
      attacker_house_id INTEGER REFERENCES houses(id),
      defender_house_id INTEGER REFERENCES houses(id),
      winner_house_id  INTEGER REFERENCES houses(id),
      location TEXT
  );
  CREATE TABLE marriages (
      id INTEGER PRIMARY KEY,
      character1_id INTEGER REFERENCES characters(id),
      character2_id INTEGER REFERENCES characters(id),
      year INTEGER, location TEXT
  );
  CREATE TABLE dragon_sightings (
      id INTEGER PRIMARY KEY,
      dragon_name TEXT, location TEXT, year INTEGER,
      witness_id INTEGER REFERENCES characters(id)
  );
