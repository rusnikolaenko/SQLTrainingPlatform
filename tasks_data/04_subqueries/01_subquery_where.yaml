solution: |
  SELECT name FROM characters
  WHERE house_id = (
      SELECT house_id FROM characters
      WHERE house_id IS NOT NULL
      GROUP BY house_id
      ORDER BY COUNT(*) DESC
      LIMIT 1
  )
check:
  ordered: false
  columns_strict: true
hints:
  - "Сначала найди house_id дома с наибольшим числом членов — это подзапрос с GROUP BY и ORDER BY COUNT(*) DESC LIMIT 1"
  - "Подзапрос возвращает одно значение, поэтому используй = (не IN)"
  - "Синтаксис: WHERE house_id = (SELECT house_id FROM characters WHERE house_id IS NOT NULL GROUP BY house_id ORDER BY COUNT(*) DESC LIMIT 1)"
theory: |
  <h3 style="color:#89b4fa;margin:0 0 8px">Подзапрос в WHERE</h3>
  <p style="color:#cdd6f4;margin:0 0 10px">
    Подзапрос — это SELECT внутри другого SELECT.
    PostgreSQL выполняет внутренний запрос <strong>первым</strong>, подставляет результат во внешнее условие.
  </p>
  <pre style="background:#1e1e2e;padding:10px;border-radius:6px;color:#a6e3a1;font-size:13px;margin:0 0 12px;overflow-x:auto">SELECT name FROM characters
  WHERE house_id = (          -- внешний запрос
      SELECT house_id         -- внутренний (подзапрос)
      FROM characters
      WHERE house_id IS NOT NULL
      GROUP BY house_id
      ORDER BY COUNT(*) DESC
      LIMIT 1
  );</pre>
  <svg viewBox="0 0 420 180" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:420px;display:block;margin:0 0 12px">
    <rect width="420" height="180" rx="6" fill="#1e1e2e"/>
    <rect x="8" y="8" width="404" height="164" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="20" y="28" fill="#89b4fa" font-size="10" font-family="monospace" font-weight="bold">① Внешний запрос</text>
    <text x="20" y="46" fill="#cdd6f4" font-size="10" font-family="monospace">SELECT name FROM characters WHERE house_id = ?</text>
    <rect x="32" y="56" width="372" height="96" rx="4" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="44" y="75" fill="#a6e3a1" font-size="10" font-family="monospace" font-weight="bold">② Подзапрос — выполняется первым</text>
    <text x="44" y="93" fill="#cdd6f4" font-size="10" font-family="monospace">SELECT house_id FROM characters</text>
    <text x="44" y="109" fill="#cdd6f4" font-size="10" font-family="monospace">WHERE house_id IS NOT NULL</text>
    <text x="44" y="125" fill="#cdd6f4" font-size="10" font-family="monospace">GROUP BY house_id ORDER BY COUNT(*) DESC LIMIT 1</text>
    <text x="44" y="143" fill="#fab387" font-size="10" font-family="monospace">→ возвращает: 1  (Дом Старков — 5 членов)</text>
    <text x="20" y="162" fill="#89b4fa" font-size="10" font-family="monospace">→ WHERE house_id = 1  →  5 персонажей Старков</text>
  </svg>
  <div style="border-left:3px solid #f38ba8;padding:8px 12px;background:#1e1e2e;border-radius:0 4px 4px 0;margin:0 0 10px">
    <strong style="color:#f38ba8">Когда = вместо IN:</strong>
    <span style="color:#cdd6f4"> Если подзапрос гарантированно возвращает <em>одну строку</em> (LIMIT 1, агрегат без GROUP BY), используй <code>=</code>. Если может вернуть несколько — используй <code>IN</code>.</span>
  </div>
  <div style="border-left:3px solid #89b4fa;padding:8px 12px;background:#1e1e2e;border-radius:0 4px 4px 0">
    <strong style="color:#89b4fa">Порядок выполнения:</strong>
    <span style="color:#cdd6f4"> сначала подзапрос, потом внешний. Это не рекурсия — подзапрос не видит строки внешнего запроса (если только он не коррелированный).</span>
  </div>
