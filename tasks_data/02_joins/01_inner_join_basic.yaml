solution: |
  SELECT c.name, h.name AS house_name, h.region
  FROM characters AS c
  INNER JOIN houses AS h ON c.house_id = h.id;
check:
  ordered: false
  columns_strict: true
hints:
  - "Нужны две таблицы: персонажи и дома."
  - "Связь идёт по characters.house_id и houses.id."
  - "Используй INNER JOIN houses AS h ON c.house_id = h.id."
theory: |
  <div class="theory-html">
    <p>JOIN соединяет строки из двух таблиц. В этой задаче персонаж хранит только house_id, а название и регион лежат в таблице houses.</p>
    <svg viewBox="0 0 560 170" width="100%" role="img" aria-label="Две таблицы связаны ключом">
      <rect width="560" height="170" rx="12" fill="#313244"/>
      <rect x="35" y="35" width="170" height="95" rx="8" fill="#1e1e2e" stroke="#89b4fa"/>
      <rect x="355" y="35" width="170" height="95" rx="8" fill="#1e1e2e" stroke="#a6e3a1"/>
      <text x="70" y="62" fill="#cdd6f4">characters</text>
      <text x="390" y="62" fill="#cdd6f4">houses</text>
      <text x="62" y="92" fill="#89b4fa">house_id</text>
      <text x="410" y="92" fill="#a6e3a1">id</text>
      <path d="M205 86 C260 45 300 45 355 86" stroke="#89b4fa" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
      <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#89b4fa"/></marker></defs>
    </svg>
    <svg viewBox="0 0 360 170" width="100%" role="img" aria-label="INNER JOIN берёт только пересечение">
      <rect width="360" height="170" rx="12" fill="#313244"/>
      <circle cx="145" cy="85" r="62" fill="#89b4fa" fill-opacity="0.35"/>
      <circle cx="215" cy="85" r="62" fill="#a6e3a1" fill-opacity="0.35"/>
      <path d="M180 34 A62 62 0 0 1 180 136 A62 62 0 0 1 180 34" fill="#a6e3a1" fill-opacity="0.75"/>
      <text x="135" y="92" fill="#cdd6f4">INNER</text>
    </svg>
    <p>Условие <code>ON c.house_id = h.id</code> говорит базе, какие строки считать связанными. Если забыть ON, получится CROSS JOIN: каждая строка слева склеится с каждой строкой справа.</p>
    <p><code>SELECT c.name, h.name FROM characters AS c INNER JOIN houses AS h ON c.house_id = h.id;</code></p>
    <div style="border-left: 3px solid #89b4fa; padding-left: 12px;">Запомни: INNER JOIN возвращает только строки, где совпадение найдено в обеих таблицах.</div>
  </div>
