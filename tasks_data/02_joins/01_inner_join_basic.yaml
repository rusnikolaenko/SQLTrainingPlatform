id: 9
topic: joins
difficulty: 2
title: "Персонажи и их дома"
description: |
  В Вестеросе персонажи связаны с домами через поле characters.house_id.

  Выведи только тех персонажей, у которых есть дом.
  Колонки результата: name, house_name, region.
schema_setup: |
  CREATE TABLE houses (
      id INTEGER PRIMARY KEY,
      name TEXT, words TEXT, region TEXT, is_great BOOLEAN
  );
  CREATE TABLE characters (
      id INTEGER PRIMARY KEY,
      name TEXT, house_id INTEGER REFERENCES houses(id),
      title TEXT, age INTEGER, is_alive BOOLEAN
  );
  CREATE TABLE battles (
      id INTEGER PRIMARY KEY,
      name TEXT,
      year INTEGER,
      attacker_house_id INTEGER REFERENCES houses(id),
      defender_house_id INTEGER REFERENCES houses(id),
      winner_house_id INTEGER REFERENCES houses(id),
      location TEXT
  );
  CREATE TABLE marriages (
      id INTEGER PRIMARY KEY,
      character1_id INTEGER REFERENCES characters(id),
      character2_id INTEGER REFERENCES characters(id),
      year INTEGER,
      location TEXT
  );
