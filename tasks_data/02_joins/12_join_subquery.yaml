  INSERT INTO marriages VALUES (1,1,2,282,'Риверран'),(2,6,4,299,'Королевская Гавань'),(3,12,7,284,'Королевская Гавань'),(4,17,14,298,'Штормовой Предел'),(5,17,15,300,'Королевская Гавань'),(6,4,23,302,'Винтерфелл'),(7,10,25,298,'Дотракийское море'),(8,19,20,295,'Солнечное Копьё');
solution: |
  SELECT c.name AS character_name, h.name AS house_name
  FROM characters AS c
  INNER JOIN houses AS h ON c.house_id = h.id
  INNER JOIN (
      SELECT DISTINCT house_id
      FROM (
          SELECT attacker_house_id AS house_id FROM battles
          UNION ALL
          SELECT defender_house_id AS house_id FROM battles
          UNION ALL
          SELECT winner_house_id AS house_id FROM battles
      ) AS battle_houses
  ) AS active_houses ON c.house_id = active_houses.house_id;
check:
  ordered: false
  columns_strict: true
hints:
  - "Сначала собери список id домов, встречающихся в battles."
  - "Подзапрос в FROM должен вернуть одну колонку house_id."
  - "Присоедини active_houses к characters по c.house_id."
theory: |
  <div class="theory-html">
    <p>Подзапрос в FROM работает как временная виртуальная таблица. Её можно соединять через JOIN так же, как обычную таблицу.</p>
    <svg viewBox="0 0 560 170" width="100%"><rect width="560" height="170" rx="12" fill="#313244"/><rect x="35" y="50" width="150" height="70" rx="8" fill="#1e1e2e" stroke="#89b4fa"/><text x="68" y="91" fill="#cdd6f4">characters</text><rect x="365" y="50" width="160" height="70" rx="8" fill="#1e1e2e" stroke="#a6e3a1"/><text x="392" y="91" fill="#cdd6f4">active_houses</text><path d="M185 85 H365" stroke="#89b4fa" stroke-width="4"/><text x="235" y="72" fill="#cdd6f4">JOIN</text></svg>
    <p>Такой подход удобен, когда перед соединением нужно подготовить набор строк: убрать дубли, объединить несколько колонок или посчитать агрегаты.</p>
    <p><code>JOIN (SELECT DISTINCT house_id FROM ...) AS active_houses ON c.house_id = active_houses.house_id</code></p>
    <div style="border-left: 3px solid #89b4fa; padding-left: 12px;">Запомни: подзапрос в FROM — это таблица, которую ты создаёшь прямо внутри запроса.</div>
  </div>
