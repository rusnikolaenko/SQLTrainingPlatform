  INSERT INTO marriages VALUES (1,1,2,282,'Риверран'),(2,6,4,299,'Королевская Гавань'),(3,12,7,284,'Королевская Гавань'),(4,17,14,298,'Штормовой Предел'),(5,17,15,300,'Королевская Гавань'),(6,4,23,302,'Винтерфелл'),(7,10,25,298,'Дотракийское море'),(8,19,20,295,'Солнечное Копьё');
solution: |
  SELECT c1.name AS spouse_1, c2.name AS spouse_2
  FROM marriages AS m
  INNER JOIN characters AS c1 ON m.character1_id = c1.id
  INNER JOIN characters AS c2 ON m.character2_id = c2.id;
check:
  ordered: false
  columns_strict: true
hints:
  - "Таблица marriages указывает на characters двумя разными колонками."
  - "Нужно два алиаса одной таблицы characters."
  - "JOIN characters AS c1 по character1_id и characters AS c2 по character2_id."
theory: |
  <div class="theory-html">
    <p>Self-join — это соединение таблицы с самой собой. Здесь characters играет две роли: первый супруг и второй супруг.</p>
    <svg viewBox="0 0 560 170" width="100%"><rect width="560" height="170" rx="12" fill="#313244"/><rect x="200" y="55" width="150" height="55" rx="8" fill="#1e1e2e" stroke="#89b4fa"/><text x="232" y="88" fill="#cdd6f4">marriages</text><rect x="35" y="55" width="125" height="55" rx="8" fill="#1e1e2e" stroke="#a6e3a1"/><text x="70" y="88" fill="#cdd6f4">c1</text><rect x="400" y="55" width="125" height="55" rx="8" fill="#1e1e2e" stroke="#f38ba8"/><text x="435" y="88" fill="#cdd6f4">c2</text><path d="M200 82 H160" stroke="#a6e3a1" stroke-width="3"/><path d="M350 82 H400" stroke="#f38ba8" stroke-width="3"/></svg>
    <p>Без алиасов база не поймёт, к какому экземпляру characters относится колонка name.</p>
    <p><code>JOIN characters AS c1 ON m.character1_id = c1.id JOIN characters AS c2 ON m.character2_id = c2.id</code></p>
    <div style="border-left: 3px solid #89b4fa; padding-left: 12px;">Запомни: self-join всегда требует понятных алиасов для каждой роли таблицы.</div>
  </div>
