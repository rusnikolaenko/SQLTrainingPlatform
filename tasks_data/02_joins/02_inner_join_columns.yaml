solution: |
  SELECT c.name AS character_name, h.words
  FROM characters AS c
  INNER JOIN houses AS h ON c.house_id = h.id;
check:
  ordered: false
  columns_strict: true
hints:
  - "Девиз хранится в таблице houses."
  - "Чтобы не путать name персонажа и name дома, используй алиасы."
  - "Нужны c.name AS character_name и h.words."
theory: |
  <div class="theory-html">
    <p>После JOIN можно выбирать конкретные колонки из обеих таблиц. Если у таблиц есть одинаковые имена колонок, помогает запись table_alias.column.</p>
    <svg viewBox="0 0 360 170" width="100%" role="img" aria-label="INNER JOIN пересечение таблиц">
      <rect width="360" height="170" rx="12" fill="#313244"/>
      <circle cx="145" cy="85" r="62" fill="#89b4fa" fill-opacity="0.35"/>
      <circle cx="215" cy="85" r="62" fill="#a6e3a1" fill-opacity="0.35"/>
      <path d="M180 34 A62 62 0 0 1 180 136 A62 62 0 0 1 180 34" fill="#a6e3a1" fill-opacity="0.75"/>
      <text x="128" y="92" fill="#cdd6f4">совпадение</text>
    </svg>
    <p>Алиас <code>characters AS c</code> делает запрос короче: вместо characters.name можно писать c.name. Это особенно важно, когда обе таблицы имеют колонку name.</p>
    <p><code>SELECT c.name, h.words FROM characters AS c JOIN houses AS h ON c.house_id = h.id;</code></p>
    <div style="border-left: 3px solid #89b4fa; padding-left: 12px;">Запомни: алиасы таблиц делают JOIN-запросы короче и защищают от неоднозначных названий колонок.</div>
  </div>
