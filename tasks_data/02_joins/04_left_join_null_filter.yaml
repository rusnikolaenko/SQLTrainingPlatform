solution: |
  SELECT h.name AS house_name
  FROM houses AS h
  LEFT JOIN characters AS c ON c.house_id = h.id
  WHERE c.id IS NULL;
check:
  ordered: false
  columns_strict: true
hints:
  - "Это задача на отсутствие совпадения."
  - "Начни с houses и присоедини characters через LEFT JOIN."
  - "Фильтр должен быть WHERE c.id IS NULL."
theory: |
  <div class="theory-html">
    <p>Антиджойн — это приём для поиска строк, у которых нет пары в другой таблице. В SQL его часто пишут как LEFT JOIN, а потом фильтруют NULL справа.</p>
    <svg viewBox="0 0 360 170" width="100%"><rect width="360" height="170" rx="12" fill="#313244"/><circle cx="145" cy="85" r="62" fill="#89b4fa" fill-opacity="0.85"/><circle cx="215" cy="85" r="62" fill="#a6e3a1" fill-opacity="0.20"/><text x="62" y="92" fill="#cdd6f4">левая часть без пары</text></svg>
    <p>NULL появляется потому, что база не нашла строку characters для конкретного дома.</p>
    <p><code>SELECT h.name FROM houses AS h LEFT JOIN characters AS c ON c.house_id = h.id WHERE c.id IS NULL;</code></p>
    <div style="border-left: 3px solid #89b4fa; padding-left: 12px;">Запомни: LEFT JOIN + WHERE right.id IS NULL — классический способ найти строки без совпадения.</div>
  </div>
