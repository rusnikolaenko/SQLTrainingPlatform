      (14, 'Лиза Аррен',          7, 'Леди',            33, false),
      (15, 'Рамси Болтон',        8, 'Лорд',            25, false);
solution: SELECT * FROM houses
check:
  ordered: false
  columns_strict: true
hints:
  - "Для чтения данных используй оператор SELECT"
  - "Символ * выбирает все колонки. Укажи таблицу через FROM"
  - "Полный синтаксис: SELECT * FROM houses"
theory: |
  <h3 style="color:#89b4fa;margin:0 0 8px">Команда SELECT</h3>
  <p style="color:#cdd6f4;margin:0 0 10px">
    <code style="color:#a6e3a1">SELECT</code> читает строки из таблицы.
    Символ <code style="color:#a6e3a1">*</code> означает «все колонки без исключения».
  </p>
  <pre style="background:#1e1e2e;padding:10px;border-radius:6px;color:#a6e3a1;font-size:13px;margin:0 0 12px;overflow-x:auto">SELECT * FROM houses;</pre>
  <svg viewBox="0 0 400 148" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:400px;display:block;margin:0 0 12px">
    <rect width="400" height="148" rx="6" fill="#1e1e2e"/>
    <rect x="8" y="8" width="168" height="132" rx="4" fill="#313244" stroke="#45475a" stroke-width="1"/>
    <rect x="8" y="8" width="168" height="20" rx="4" fill="#45475a"/>
    <text x="92" y="22" text-anchor="middle" fill="#89b4fa" font-size="10" font-family="monospace" font-weight="bold">houses</text>
    <rect x="8" y="29" width="168" height="14" fill="#2a2a3e"/>
    <text x="16" y="40" fill="#cdd6f4" font-size="9" font-family="monospace">id  name       region     is_great</text>
    <text x="16" y="56" fill="#a6e3a1" font-size="9" font-family="monospace"> 1  Старк      Север      true</text>
    <text x="16" y="70" fill="#a6e3a1" font-size="9" font-family="monospace"> 2  Ланнистер  Запад      true</text>
    <text x="16" y="84" fill="#a6e3a1" font-size="9" font-family="monospace"> 3  Таргариен  Д.Камень   true</text>
    <text x="16" y="98" fill="#a6e3a1" font-size="9" font-family="monospace"> 4  Баратеон   Шт.Земли   true</text>
    <text x="92" y="122" text-anchor="middle" fill="#585b70" font-size="9" font-family="monospace">... ещё 4 строки ...</text>
    <text x="188" y="76" fill="#89b4fa" font-size="22">→</text>
    <text x="184" y="93" fill="#89b4fa" font-size="8" font-family="monospace" text-anchor="middle">SELECT *</text>
    <rect x="214" y="8" width="178" height="132" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
    <rect x="214" y="8" width="178" height="20" rx="4" fill="#45475a"/>
    <text x="303" y="22" text-anchor="middle" fill="#a6e3a1" font-size="10" font-family="monospace" font-weight="bold">результат</text>
    <rect x="214" y="29" width="178" height="14" fill="#2a2a3e"/>
    <text x="222" y="40" fill="#cdd6f4" font-size="9" font-family="monospace">id  name       region     is_great</text>
    <text x="222" y="56" fill="#a6e3a1" font-size="9" font-family="monospace"> 1  Старк      Север      true</text>
    <text x="222" y="70" fill="#a6e3a1" font-size="9" font-family="monospace"> 2  Ланнистер  Запад      true</text>
    <text x="222" y="84" fill="#a6e3a1" font-size="9" font-family="monospace"> 3  Таргариен  Д.Камень   true</text>
    <text x="222" y="98" fill="#a6e3a1" font-size="9" font-family="monospace"> 4  Баратеон   Шт.Земли   true</text>
    <text x="303" y="122" text-anchor="middle" fill="#a6e3a1" font-size="9" font-family="monospace">все 8 строк × 5 колонок</text>
  </svg>
  <div style="border-left:3px solid #89b4fa;padding:8px 12px;background:#1e1e2e;border-radius:0 4px 4px 0">
    <strong style="color:#89b4fa">Запомни:</strong>
    <span style="color:#cdd6f4"> <code>SELECT *</code> удобен при изучении данных, но в реальных проектах лучше перечислять нужные колонки явно — это делает запрос быстрее и понятнее.</span>
  </div>
