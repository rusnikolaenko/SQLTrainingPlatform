id: 8
topic: basics
difficulty: 3
title: "Поиск Старков"
description: |
  Используй таблицу characters.

  В поле name хранится полное имя персонажа, включая фамилию.
  Например: 'Эддард Старк', 'Арья Старк', 'Санса Старк'.

  Задача: выбери name и title всех персонажей,
  чьё имя содержит слово 'Старк' (в любой позиции).
  Используй оператор LIKE.
  Порядок строк не важен.
schema_setup: |
  CREATE TABLE houses (
      id INTEGER PRIMARY KEY,
      name TEXT,
      words TEXT,
      region TEXT,
      is_great BOOLEAN
  );
  CREATE TABLE characters (
      id INTEGER PRIMARY KEY,
      name TEXT,
      house_id INTEGER REFERENCES houses(id),
      title TEXT,
      age INTEGER,
      is_alive BOOLEAN
  );
  INSERT INTO houses VALUES
      (1, 'Старк',      'Зима близко',                         'Север',            true),
      (2, 'Ланнистер',  'Слышишь мой рёв',                     'Запад',            true),
      (3, 'Таргариен',  'Огонь и кровь',                       'Драконий Камень',  true),
      (4, 'Баратеон',   'Наша — ярость',                       'Штормовые Земли',  true),
      (5, 'Тирелл',     'Растём в силе',                       'Простор',          true),
      (6, 'Мартелл',    'Несломленный, непогнутый, несогнувшийся', 'Дорн',         true),
      (7, 'Аррен',      'Высоко, как честь',                   'Долина Аррен',     true),
      (8, 'Болтон',     'Наш нож всегда острее',               'Север',            false);
  INSERT INTO characters VALUES
      (1,  'Эддард Старк',        1, 'Лорд',            35, false),
      (2,  'Джон Сноу',           1, 'Лорд',            17, true),
      (3,  'Арья Старк',          1, 'Леди',            11, true),
      (4,  'Санса Старк',         1, 'Леди',            14, true),
      (5,  'Тирион Ланнистер',    2, 'Лорд',            32, true),
      (6,  'Серсея Ланнистер',    2, 'Королева',        34, true),
      (7,  'Джейме Ланнистер',    2, 'Сир',             36, true),
      (8,  'Дейенерис Таргариен', 3, 'Королева',        16, true),
      (9,  'Визерис Таргариен',   3, 'Принц',           22, false),
      (10, 'Джоффри Баратеон',    4, 'Король',          13, false),
      (11, 'Станнис Баратеон',    4, 'Лорд',            48, false),
      (12, 'Маргери Тирелл',      5, 'Королева',        15, false),
      (13, 'Оберин Мартелл',      6, 'Принц',           42, false),
      (14, 'Лиза Аррен',          7, 'Леди',            33, false),
      (15, 'Рамси Болтон',        8, 'Лорд',            25, false);
solution: SELECT name, title FROM characters WHERE name LIKE '%Старк%'
check:
  ordered: false
  columns_strict: true
hints:
  - "Оператор LIKE позволяет искать по шаблону. % заменяет любое количество символов"
  - "Шаблон '%Старк%' найдёт все строки, где слово 'Старк' есть в любом месте"
  - "Синтаксис: WHERE name LIKE '%Старк%'"
theory: |
  <h3 style="color:#89b4fa;margin:0 0 8px">Поиск по шаблону: LIKE</h3>
  <p style="color:#cdd6f4;margin:0 0 10px">
    <code style="color:#a6e3a1">LIKE</code> проверяет, совпадает ли строка с шаблоном.
    В шаблоне используются два спецсимвола:
  </p>
  <table style="border-collapse:collapse;margin:0 0 12px;font-family:monospace;font-size:13px;width:100%">
    <tr style="background:#45475a">
      <th style="padding:6px 12px;color:#89b4fa;text-align:left">Символ</th>
      <th style="padding:6px 12px;color:#89b4fa;text-align:left">Смысл</th>
      <th style="padding:6px 12px;color:#89b4fa;text-align:left">Пример шаблона</th>
      <th style="padding:6px 12px;color:#89b4fa;text-align:left">Совпадёт с</th>
    </tr>
    <tr style="background:#313244">
      <td style="padding:5px 12px;color:#a6e3a1">%</td>
      <td style="padding:5px 12px;color:#cdd6f4">любое кол-во символов (в т.ч. 0)</td>
      <td style="padding:5px 12px;color:#fab387">'%Старк%'</td>
      <td style="padding:5px 12px;color:#cdd6f4">Арья Старк, Эддард Старк</td>
    </tr>
    <tr style="background:#2a2a3e">
      <td style="padding:5px 12px;color:#a6e3a1">_</td>
      <td style="padding:5px 12px;color:#cdd6f4">ровно один любой символ</td>
      <td style="padding:5px 12px;color:#fab387">'Арь_'</td>
      <td style="padding:5px 12px;color:#cdd6f4">Арья, Арьб, Арьё...</td>
    </tr>
  </table>
  <svg viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:400px;display:block;margin:0 0 12px">
    <rect width="400" height="120" rx="6" fill="#1e1e2e"/>
    <text x="200" y="18" text-anchor="middle" fill="#89b4fa" font-size="10" font-family="monospace">Шаблон: '%Старк%'</text>
    <rect x="8" y="26" width="384" height="16" fill="#313244" rx="2"/>
    <text x="16" y="38" fill="#a6e3a1" font-size="10" font-family="monospace">✓  'Эддард Старк'</text>
    <text x="220" y="38" fill="#585b70" font-size="9" font-family="monospace">← содержит 'Старк'</text>
    <rect x="8" y="44" width="384" height="16" fill="#313244" rx="2"/>
    <text x="16" y="56" fill="#a6e3a1" font-size="10" font-family="monospace">✓  'Арья Старк'</text>
    <text x="220" y="56" fill="#585b70" font-size="9" font-family="monospace">← содержит 'Старк'</text>
    <rect x="8" y="62" width="384" height="16" fill="#313244" rx="2"/>
    <text x="16" y="74" fill="#a6e3a1" font-size="10" font-family="monospace">✓  'Санса Старк'</text>
    <text x="220" y="74" fill="#585b70" font-size="9" font-family="monospace">← содержит 'Старк'</text>
    <rect x="8" y="80" width="384" height="16" fill="#2a2a3e" rx="2"/>
    <text x="16" y="92" fill="#585b70" font-size="10" font-family="monospace">✗  'Джон Сноу'</text>
    <text x="220" y="92" fill="#585b70" font-size="9" font-family="monospace">← нет 'Старк' — не подходит</text>
    <text x="200" y="112" text-anchor="middle" fill="#585b70" font-size="9">% в начале = любые символы перед 'Старк'</text>
  </svg>
  <p style="color:#cdd6f4;margin:0 0 10px;font-size:13px">
    <strong style="color:#fab387">Важно:</strong> LIKE чувствителен к регистру в PostgreSQL.
    <code>'%старк%'</code> и <code>'%Старк%'</code> — разные шаблоны.
    Для регистронезависимого поиска используй <code style="color:#a6e3a1">ILIKE</code>.
  </p>
  <div style="border-left:3px solid #89b4fa;padding:8px 12px;background:#1e1e2e;border-radius:0 4px 4px 0">
    <strong style="color:#89b4fa">Запомни:</strong>
    <span style="color:#cdd6f4"> <code>'%слово%'</code> — содержит; <code>'слово%'</code> — начинается с; <code>'%слово'</code> — заканчивается на. Используй минимум спецсимволов — это ускоряет поиск.</span>
  </div>
