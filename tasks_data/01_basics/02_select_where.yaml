id: 2
topic: basics
difficulty: 1
title: "Сотрудники с высокой зарплатой"
description: |
  В таблице employees хранятся данные о сотрудниках.

  Структура таблицы:
  - id (INTEGER) — уникальный идентификатор
  - name (TEXT) — имя сотрудника
  - department (TEXT) — отдел
  - salary (NUMERIC) — зарплата

  Выбери id, name и salary только тех сотрудников,
  у кого зарплата строго больше 75000.
schema_setup: |
  CREATE TABLE employees (
      id INTEGER,
      name TEXT,
      department TEXT,
      salary NUMERIC
  );
  INSERT INTO employees VALUES
      (1, 'Иван Петров', 'Разработка', 90000),
      (2, 'Мария Сидорова', 'Маркетинг', 75000),
      (3, 'Алексей Козлов', 'Разработка', 120000),
      (4, 'Ольга Новикова', 'HR', 65000),
      (5, 'Дмитрий Морозов', 'Маркетинг', 80000);
solution: |
  SELECT id, name, salary FROM employees WHERE salary > 75000;
check:
  ordered: false
  columns_strict: true
hints:
  - "Используй оператор WHERE для фильтрации строк"
  - "Условие фильтрации: salary > 75000"
theory: |
  WHERE позволяет фильтровать строки по условию.
  Синтаксис: SELECT ... FROM <таблица> WHERE <условие>;
  Операторы сравнения: =, >, <, >=, <=, <> (не равно).
